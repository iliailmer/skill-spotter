[project]
name = "skill-spotter"
version = "0.1.0"
description = "Detect repeated requests in Claude Code history and suggest skills"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
skill-spotter = "skill_spotter.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skill_spotter"]

[tool.pytest.ini_options]
pythonpath = ["src"]
